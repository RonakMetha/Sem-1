<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Auto-Runner (Auto-Climb Pillars & Heart System)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      user-select: none;
    }

    #hud {
      width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
      color: #f7d51d;
      text-shadow: 2px 2px #000;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 440px;
    }

    canvas {
      background-color: #5c94fc;
      border: 4px solid #ffffff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 4px;
    }

    .overlay h2 {
      font-size: 38px;
      color: #e52521;
      margin: 0 0 10px 0;
      text-shadow: 3px 3px #000;
    }

    .overlay p {
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 25px;
      text-align: center;
    }

    .btn {
      background-color: #e52521;
      color: #ffffff;
      border: 3px solid #ffffff;
      padding: 12px 32px;
      font-size: 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 4px 0 #800000;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background-color: #f7d51d;
      color: #000000;
      box-shadow: 0 4px 0 #998000;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #998000;
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 14px;
      color: #a0a0b0;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>MARIO <br><span id="scoreText">000000</span></div>
    <div>COINS <br>🪙 <span id="coinText">00</span></div>
    <div>DISTANCE <br><span id="distText">0</span>m</div>
    <div>HEALTH <br><span id="livesText">❤️ ❤️ ❤️</span></div>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="440"></canvas>

    <!-- Start Overlay -->
    <div id="startOverlay" class="overlay">
      <h2>SUPER MARIO RUN</h2>
      <p>Green Pillars: Auto-Climb | Enemies: Jump Manually to Stomp or Avoid!</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2>GAME OVER</h2>
      <p id="finalScoreText">Final Distance: 0m | Score: 0</p>
      <button class="btn" id="restartBtn">RESTART GAME</button>
    </div>
  </div>

  <div class="controls-hint">
    <strong>GREEN PILLARS AUTO-CLIMBED</strong> &nbsp;|&nbsp; 
    Press <strong>SPACE / W / UP ARROW</strong> to Jump over / Stomp Enemies
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreText = document.getElementById('scoreText');
    const coinText = document.getElementById('coinText');
    const distText = document.getElementById('distText');
    const livesText = document.getElementById('livesText');
    
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScoreText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987, now);
        osc.frequency.setValueAtTime(1318, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'stomp') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // World & Physics Constants
    const GRAVITY = 0.5;
    const groundY = 380;

    // Game States
    let gameState = 'START'; 
    let score = 0;
    let coins = 0;
    let lives = 3; // 3 Hearts Health System
    let cameraX = 0;
    let nextSpawnX = 600;

    // Mario Object
    const mario = {
      x: 100,
      y: 280,
      width: 32,
      height: 40,
      vx: 2.8, 
      vy: 0,
      speed: 2.8,
      jumpForce: -11.5,
      isGrounded: false,
      invincibleTimer: 0
    };

    // Dynamic Level Collections
    let blocks = [];
    let pipes = [];
    let goombas = [];
    let scatteredCoins = [];
    let particles = [];

    // Sparkle Particles
    function createSparkles(x, y, color = '#f7d51d', count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 5 + 2,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Key input listener (Manual Jump trigger for enemies/blocks)
    const keys = {};

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW'].includes(e.code)) {
        e.preventDefault();
      }

      if (!keys[e.code]) {
        if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && mario.isGrounded && gameState === 'PLAYING') {
          mario.vy = mario.jumpForce;
          mario.isGrounded = false;
          playSound('jump');
        }
      }
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      startGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameOverOverlay.style.display = 'none';
      startGame();
    });

    function startGame() {
      lives = 3;
      score = 0;
      coins = 0;
      cameraX = 0;
      nextSpawnX = 500;

      mario.x = 100;
      mario.y = 280;
      mario.vx = mario.speed;
      mario.vy = 0;
      mario.invincibleTimer = 0;

      blocks = [];
      pipes = [];
      goombas = [];
      scatteredCoins = [];
      particles = [];

      spawnInitialLevel();
      gameState = 'PLAYING';
      updateHUD();
    }

    function spawnInitialLevel() {
      blocks.push({ x: 280, y: 260, width: 32, height: 32, type: 'question', hit: false });
      blocks.push({ x: 312, y: 260, width: 32, height: 32, type: 'brick' });
      blocks.push({ x: 344, y: 260, width: 32, height: 32, type: 'question', hit: false });
      
      scatteredCoins.push({ x: 200, y: 320, collected: false });
      scatteredCoins.push({ x: 220, y: 300, collected: false });
      scatteredCoins.push({ x: 240, y: 320, collected: false });
    }

    function generateLevelChunk() {
      while (nextSpawnX < mario.x + 900) {
        const rand = Math.random();

        if (rand < 0.35) {
          const pipeHeight = Math.floor(Math.random() * 35) + 55;
          pipes.push({ x: nextSpawnX, y: groundY - pipeHeight, width: 54, height: pipeHeight });
          
          if (Math.random() > 0.4) {
            goombas.push({ x: nextSpawnX + 160, y: groundY - 28, width: 32, height: 28, vx: -0.8, alive: true });
          }
          nextSpawnX += 260;
        } 
        else if (rand < 0.7) {
          const blockY = groundY - 120 - (Math.random() > 0.5 ? 40 : 0);
          const count = Math.floor(Math.random() * 3) + 2;

          for (let i = 0; i < count; i++) {
            const isQ = Math.random() < 0.4;
            blocks.push({
              x: nextSpawnX + (i * 32),
              y: blockY,
              width: 32,
              height: 32,
              type: isQ ? 'question' : 'brick',
              hit: false
            });

            if (!isQ && Math.random() < 0.6) {
              scatteredCoins.push({ x: nextSpawnX + (i * 32) + 10, y: blockY - 30, collected: false });
            }
          }

          if (Math.random() < 0.5) {
            goombas.push({ x: nextSpawnX + 40, y: groundY - 28, width: 32, height: 28, vx: -0.9, alive: true });
          }

          nextSpawnX += (count * 32) + 200;
        } 
        else {
          for (let i = 0; i < 4; i++) {
            const cy = groundY - 70 - Math.sin((i / 3) * Math.PI) * 40;
            scatteredCoins.push({ x: nextSpawnX + (i * 30), y: cy, collected: false });
          }
          nextSpawnX += 220;
        }
      }

      pipes = pipes.filter(p => p.x + p.width > cameraX - 200);
      blocks = blocks.filter(b => b.x + b.width > cameraX - 200);
      goombas = goombas.filter(g => g.x + g.width > cameraX - 200);
      scatteredCoins = scatteredCoins.filter(c => c.x > cameraX - 200);
    }

    function updateHUD() {
      scoreText.textContent = String(score).padStart(6, '0');
      coinText.textContent = String(coins).padStart(2, '0');
      distText.textContent = Math.max(0, Math.floor(mario.x / 10));
      
      // Render Health Hearts (3 max)
      let heartDisplay = '';
      for (let i = 0; i < 3; i++) {
        heartDisplay += i < lives ? '❤️ ' : '🖤 ';
      }
      livesText.textContent = heartDisplay.trim();
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      // Handle Invulnerability Timer after getting hit
      if (mario.invincibleTimer > 0) {
        mario.invincibleTimer--;
      }

      // CONTINUOUS FORWARD MOVEMENT
      mario.vx = mario.speed;
      mario.x += mario.vx;

      // Camera follows Mario
      cameraX = mario.x - 180;

      // Vertical Physics
      mario.vy += GRAVITY;
      mario.y += mario.vy;

      let landed = false;

      // 1. Ground Collision
      if (mario.y + mario.height >= groundY) {
        mario.y = groundY - mario.height;
        mario.vy = 0;
        landed = true;
      }

      // 2. GREEN PILLAR COLLISION (AUTO-CLIMB PILLARS ONLY)
      pipes.forEach(pipe => {
        // Landing on top of green pillar
        if (
          mario.x + mario.width > pipe.x &&
          mario.x < pipe.x + pipe.width &&
          mario.y + mario.height >= pipe.y &&
          mario.y + mario.height - mario.vy <= pipe.y + 14 &&
          mario.vy >= 0
        ) {
          mario.y = pipe.y - mario.height;
          mario.vy = 0;
          landed = true;
        } 
        // AUTO-CLIMB: Trigger automatic jump ONLY when Mario runs into a green pillar
        else if (
          mario.x + mario.width >= pipe.x - 6 &&
          mario.x < pipe.x &&
          mario.y + mario.height > pipe.y
        ) {
          if (mario.isGrounded) {
            mario.vy = mario.jumpForce;
            mario.isGrounded = false;
            playSound('jump');
          }
        }
      });

      // 3. Block Collisions
      blocks.forEach(block => {
        if (
          mario.x + mario.width > block.x &&
          mario.x < block.x + block.width &&
          mario.y < block.y + block.height &&
          mario.y + mario.height > block.y
        ) {
          if (mario.vy >= 0 && mario.y + mario.height - mario.vy <= block.y + 10) {
            mario.y = block.y - mario.height;
            mario.vy = 0;
            landed = true;
          } else if (mario.vy < 0 && mario.y - mario.vy >= block.y + block.height - 10) {
            mario.y = block.y + block.height;
            mario.vy = 0;

            if (block.type === 'question' && !block.hit) {
              block.hit = true;
              coins++;
              score += 200;
              playSound('coin');
              createSparkles(block.x + 16, block.y, '#f7d51d', 14);
              updateHUD();
            }
          } else if (mario.x + mario.width > block.x && mario.x < block.x + 10) {
            mario.x = block.x - mario.width;
          }
        }
      });

      mario.isGrounded = landed;

      // 4. Coin Pickup
      scatteredCoins.forEach(coin => {
        if (!coin.collected &&
            mario.x + mario.width > coin.x - 12 &&
            mario.x < coin.x + 12 &&
            mario.y + mario.height > coin.y - 12 &&
            mario.y < coin.y + 12) {
          coin.collected = true;
          coins++;
          score += 100;
          playSound('coin');
          createSparkles(coin.x, coin.y, '#f7d51d', 15);
          updateHUD();
        }
      });

      // 5. GOOMBA ENEMY LOGIC (NO AUTO-CLIMB ON ENEMIES)
      goombas.forEach(g => {
        if (!g.alive) return;

        g.x += g.vx;

        pipes.forEach(p => {
          if (g.x + g.width > p.x && g.x < p.x + p.width) g.vx *= -1;
        });

        if (
          mario.x + mario.width > g.x &&
          mario.x < g.x + g.width &&
          mario.y + mario.height > g.y &&
          mario.y < g.y + g.height
        ) {
          // Player manually jumped on top of Goomba -> Stomp success!
          if (mario.vy > 0 && mario.y + mario.height - mario.vy <= g.y + 12) {
            g.alive = false;
            mario.vy = -7.5;
            score += 200;
            playSound('stomp');
            createSparkles(g.x + 16, g.y + 10, '#ff4d4d', 12);
            createSparkles(g.x + 16, g.y + 10, '#ffffff', 8);
            updateHUD();
          } 
          // Player hit by enemy from the side/below (Drop 1 Heart health)
          else if (mario.invincibleTimer === 0) {
            lives -= 1; // Drop by 1 heart (3 -> 2 -> 1 -> 0)
            mario.invincibleTimer = 75; // ~1.25 sec invincibility grace period
            playSound('hit');
            createSparkles(mario.x + 16, mario.y + 20, '#ff2222', 16);
            updateHUD();

            if (lives <= 0) {
              triggerGameOver();
            }
          }
        }
      });

      generateLevelChunk();
      updateParticles();
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      finalScoreText.textContent = `Distance: ${Math.floor(mario.x / 10)}m | Score: ${score} | Coins: ${coins}`;
      gameOverOverlay.style.display = 'flex';
    }

    // --- DRAWING ---

    function drawMario() {
      // Flash effect when Mario is invincible after taking damage
      if (mario.invincibleTimer > 0 && Math.floor(mario.invincibleTimer / 6) % 2 === 0) {
        return;
      }

      ctx.save();
      const drawX = mario.x - cameraX;
      ctx.translate(drawX, mario.y);

      // Cap
      ctx.fillStyle = '#e52521';
      ctx.fillRect(6, 0, 22, 8);
      ctx.fillRect(4, 4, 26, 6);

      // Face
      ctx.fillStyle = '#fcc082';
      ctx.fillRect(8, 10, 18, 12);

      // Mustache & Eye
      ctx.fillStyle = '#4b2a00';
      ctx.fillRect(18, 12, 4, 4);
      ctx.fillRect(14, 16, 12, 4);

      // Shirt
      ctx.fillStyle = '#e52521';
      ctx.fillRect(6, 22, 20, 8);

      // Overalls
      ctx.fillStyle = '#002498';
      ctx.fillRect(8, 24, 16, 12);
      ctx.fillRect(4, 30, 24, 6);

      // Buttons
      ctx.fillStyle = '#f7d51d';
      ctx.fillRect(10, 28, 3, 3);
      ctx.fillRect(19, 28, 3, 3);

      // Shoes
      ctx.fillStyle = '#4b2a00';
      ctx.fillRect(2, 34, 10, 6);
      ctx.fillRect(20, 34, 10, 6);

      ctx.restore();
    }

    function drawPipe(pipe) {
      const px = pipe.x - cameraX;
      ctx.fillStyle = '#00a800';
      ctx.fillRect(px - 3, pipe.y, pipe.width + 6, 22);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(px, pipe.y + 2, 6, 18);
      ctx.strokeStyle = '#000000';
      ctx.strokeRect(px - 3, pipe.y, pipe.width + 6, 22);

      ctx.fillStyle = '#00a800';
      ctx.fillRect(px, pipe.y + 22, pipe.width, pipe.height - 22);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(px + 3, pipe.y + 22, 6, pipe.height - 22);
      ctx.strokeRect(px, pipe.y + 22, pipe.width, pipe.height - 22);
    }

    function drawBlock(block) {
      const bx = block.x - cameraX;
      if (block.type === 'question') {
        ctx.fillStyle = block.hit ? '#804000' : '#f7d51d';
        ctx.fillRect(bx, block.y, block.width, block.height);
        ctx.strokeStyle = '#000000';
        ctx.strokeRect(bx, block.y, block.width, block.height);

        if (!block.hit) {
          ctx.fillStyle = '#804000';
          ctx.font = 'bold 20px monospace';
          ctx.fillText('?', bx + 10, block.y + 24);
        }
      } else if (block.type === 'brick') {
        ctx.fillStyle = '#b84418';
        ctx.fillRect(bx, block.y, block.width, block.height);
        ctx.strokeStyle = '#000000';
        ctx.strokeRect(bx, block.y, block.width, block.height);

        ctx.strokeStyle = '#fcc082';
        ctx.beginPath();
        ctx.moveTo(bx, block.y + 16);
        ctx.lineTo(bx + 32, block.y + 16);
        ctx.moveTo(bx + 16, block.y);
        ctx.lineTo(bx + 16, block.y + 16);
        ctx.stroke();
      }
    }

    function drawGoomba(g) {
      if (!g.alive) return;
      const gx = g.x - cameraX;

      ctx.fillStyle = '#803000';
      ctx.fillRect(gx + 4, g.y, 24, 16);
      ctx.fillRect(gx, g.y + 6, 32, 12);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(gx + 6, g.y + 8, 6, 8);
      ctx.fillRect(gx + 20, g.y + 8, 6, 8);
      ctx.fillStyle = '#000000';
      ctx.fillRect(gx + 10, g.y + 10, 2, 4);
      ctx.fillRect(gx + 20, g.y + 10, 2, 4);

      ctx.fillRect(gx + 2, g.y + 20, 10, 8);
      ctx.fillRect(gx + 20, g.y + 20, 10, 8);
    }

    function drawGround() {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#00a800';
      ctx.fillRect(0, groundY, canvas.width, 8);

      ctx.strokeStyle = '#803000';
      const startX = -(cameraX % 32);
      for (let x = startX; x < canvas.width; x += 32) {
        ctx.strokeRect(x, groundY + 8, 32, 26);
        ctx.strokeRect(x, groundY + 34, 32, 26);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGround();
      pipes.forEach(drawPipe);
      blocks.forEach(drawBlock);

      scatteredCoins.forEach(coin => {
        if (!coin.collected) {
          const cx = coin.x - cameraX;
          ctx.fillStyle = '#f7d51d';
          ctx.beginPath();
          ctx.ellipse(cx, coin.y, 6, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        }
      });

      goombas.forEach(drawGoomba);
      drawMario();
      drawParticles();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 300px;
            width: 300px;
            background-color: red;
        }
        div:hover{
            animation-name: yoo;
            animation-duration: 3s;
            transition-timing-function: ease-in-out;
        }
        @keyframes yoo {
            0%{
                background-color: black;
                border-radius:30%;
                height: 100vh;
                width: 100vw;

            }
            50%{
                background-color: blue;
                height: 500px;
                width: 500px;

            }100%{
                background-color: goldenrod;
                 height: 100px;
                 width: 100px;

            }


        }
    </style>
</head>
<body>
    <div>

    </div>
    
</body>
</html>

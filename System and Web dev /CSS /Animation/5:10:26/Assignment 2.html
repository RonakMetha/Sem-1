<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: black;
        }
        
        #main{
               display: flex;
            justify-content: center;
            align-items: center;
            margin: 330px auto;
            gap: 9px;
        }
        .dot{
    
            height: 50px;
            width: 50px;
            border-radius: 50%;
            margin: 5px;
            display: inline-block;
            animation: loading 1s ease-in-out  infinite alternate;

        }
      
        #one{
            
            background:linear-gradient(rgb(237, 4, 4),rgb(232, 109, 43)) ;
            

        }
         #two{
           
            background:linear-gradient(blue,rgb(96, 164, 208)) ;
            animation-delay:0.2s ;
            
        }
         #three{
            background:linear-gradient(rgb(190, 25, 80),rgb(238, 142, 158)) ;
            animation-delay:0.4s ;
            
        }
        @keyframes loading {
            0%{
                transform: translateY(0) scale(1);
                opacity: 0.5;
                
            }
              50%{
                transform: translateY(-40px) scale(1.3);
                opacity: 1;
            }
              100%{
                transform: translateY(0) scale(1);
                opacity: 0.5;
            }
        }

    </style>

</head>
<body>
    <div id="main">
    <div id="one" class="dot"></div>
    <div id="two" class="dot"></div>
    <div id="three" class="dot"></div>
    </div>

    
</body>
</html>
